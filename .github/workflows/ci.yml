name: CI

on: [push]

jobs:
  assemble:
    name: Assemble

    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew assemble
  build:
    name: Build

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble
      - test

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
  test:
    name: Run tests

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew test
      - name: Notify Slack if tests fail
        if: failure() && github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,author,message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  sim:
    name: Straight-line test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: assemble
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run straight-line test
        run: ./gradlew :offseason-bot:straightLineTest

      - name: Show motion summary
        if: always()
        run: |
          report=offseason-bot/build/reports/straightLineTest/motion/summary.md
          if [ -f "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: straight-line-results
          retention-days: 14
          path: |
            offseason-bot/build/reports/tests/straightLineTest/
            offseason-bot/build/test-results/straightLineTest/
            offseason-bot/build/reports/straightLineTest/
            offseason-bot/logs/
  style:
    name: Check formatting

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
  ruff:
    name: Lint Python

    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v4.1.0
      - name: Check formatting with Ruff
        run: ruff format --check
  ty:
    name: Type check Python

    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Type check with ty
        run: uv run --all-packages ty check
