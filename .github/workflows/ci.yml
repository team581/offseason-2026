name: CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    name: Build and test

    runs-on: blacksmith-2vcpu-ubuntu-2604

    steps:
      - parallel:
          - name: Checkout Git repository
            uses: actions/checkout@v7
          - name: Setup Java
            uses: actions/setup-java@v6
            with:
              distribution: "temurin"
              java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew assemble
      - name: Run tests
        id: tests
        run: ./gradlew test
      - name: Notify Slack if tests fail
        if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,author,message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  style:
    name: Check formatting

    runs-on: blacksmith-2vcpu-ubuntu-2604

    steps:
      - parallel:
          - name: Checkout Git repository
            uses: actions/checkout@v7
          - name: Setup Java
            uses: actions/setup-java@v6
            with:
              distribution: "temurin"
              java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
  ruff:
    name: Lint Python

    runs-on: blacksmith-2vcpu-ubuntu-2604

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "--version"
      - parallel:
          - name: Lint with Ruff
            run: ruff check
          - name: Check formatting with Ruff
            run: ruff format --check
  ty:
    name: Type check Python

    runs-on: blacksmith-2vcpu-ubuntu-2604

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          prune-cache: false
      - name: Install dependencies
        run: uv sync --all-packages
      - name: Type check with ty
        run: uv run --all-packages ty check
