name: CI

on: [push]

jobs:
  assemble:
    name: Assemble

    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble
        run: ./gradlew assemble
  build:
    name: Build

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble
      - test

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
  test:
    name: Run tests

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: ./gradlew test
      - name: Notify Slack if tests fail
        if: failure() && github.ref == 'refs/heads/main'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,author,message
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  style:
    name: Check formatting

    runs-on: blacksmith-4vcpu-ubuntu-2404

    needs:
      - assemble

    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
