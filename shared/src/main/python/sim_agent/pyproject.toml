[project]
name = "sim-agent"
version = "0.1.0"
description = "Agent-in-the-loop control of the WPILib simulator over NetworkTables"
requires-python = ">=3.14"
dependencies = ["pyntcore>=2026.2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_agent"]

[project.scripts]
sim-agent = "sim_agent.cli:main"

[dependency-groups]
dev = ["ty"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["**/*.py"]
