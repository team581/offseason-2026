plugins {
	id 'com.diffplug.spotless' version '8.10.3'
	id 'net.ltgt.errorprone' version '5.1.1'
	// Declared here with apply false so the plugin is loaded once by the root classloader
	// This fixes Windows issues with the VS Code language server
	id "edu.wpi.first.GradleRIO" version "2026.2.1" apply false
}

repositories {
	mavenCentral()
}

allprojects {
	group = 'frc.team581'
	version = '2026.0.0'
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'net.ltgt.errorprone'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
			vendor = JvmVendorSpec.ADOPTIUM
		}
	}

	repositories {
		mavenCentral()
	}

	// Error Prone dependencies
	dependencies {
		compileOnly "com.google.errorprone:error_prone_annotations:2.50.0"
		errorprone "com.google.errorprone:error_prone_core:2.50.0"
		errorprone "tech.picnic.error-prone-support:error-prone-contrib:0.30.0"
		errorprone "tech.picnic.error-prone-support:refaster-runner:0.30.0"

		testImplementation "org.assertj:assertj-core:3.27.7"
	}

	// Add custom Refaster rules to subprojects (except refaster-rules itself and shared, which refaster-rules depends on)
	if (project.name != 'refaster-rules' && project.name != 'shared') {
		dependencies {
			errorprone project(':refaster-rules')
		}

		// Ensure downstream compileJava tasks properly track refaster-rules as an input for cache invalidation.
		// The errorprone configuration dependency alone isn't sufficient - Gradle doesn't track project
		// dependencies in annotation processor paths as inputs, causing stale cache hits when rules change.
		afterEvaluate {
			def refasterJar = rootProject.project(':refaster-rules').tasks.named('jar')
			tasks.withType(JavaCompile).configureEach {
				inputs.files(refasterJar).withPropertyName('refasterRulesJar')
			}
		}
	}

	tasks.withType(JavaCompile) {
		// Configure string concat to always inline compile
		options.compilerArgs.add '-XDstringConcat=inline'
		// Required by Error Prone on JDK 21+
		options.compilerArgs.add '-XDaddTypeAnnotationsToSymbol=true'
		options.release = 17
	}

	// Error Prone configuration
	tasks.withType(JavaCompile).configureEach {
		options.errorprone.disableWarningsInGeneratedCode = true
		options.errorprone.disable("Var", "BooleanParameter", "InlineMeSuggester", "ImmutableEnumChecker")

		// Exclude specific Refaster rules (these can't be disabled with disable(), they require NamePattern)
		// SequencedCollectionGetFirst and SequencedCollectionGetLast suggest .getFirst()/.getLast() which require Java 21+
		options.errorprone.errorproneArgs.add "-XepOpt:Refaster:NamePattern=^(?!.*SequencedCollectionGet(First|Last)).*"

		// Set the ERRORPRONE_AUTOFIX environment variable to fix files in place
		if (System.getenv().containsKey("ERRORPRONE_AUTOFIX")) {
			options.errorprone.errorproneArgs.add "-XepPatchLocation:IN_PLACE"

			// Disable dead code checks during autofix to prevent automatic deletion
			// These checks still run as errors during normal builds
			options.errorprone.disable("UnusedVariable", "UnusedLabel", "UnusedMethod", "UnusedNestedClass", "UnusedTypeParameter")
		}
	}

	// Common test configuration
	test {
		useJUnitPlatform()
		systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
	}
}

// Spotless configuration applied to all projects

spotless {
	enforceCheck = false

	encoding = 'UTF-8'
	lineEndings = 'UNIX'

	java {
		target subprojects.collect {
			fileTree(it.projectDir) {
				include '**/*.java'
			}
		}
		eclipse().configFile('eclipse-formatter.properties').sortMembersEnabled(true).sortMembersVisibilityOrderEnabled(true)
		googleJavaFormat()
		licenseHeader ''

		targetExclude('**/generated/**')
	}

	groovyGradle {
		target '**/*.gradle'
		greclipse()
		leadingSpacesToTabs()
		endWithNewline()
	}

	json {
		target '**/*.json'
		simple().indentWithSpaces(2)

		targetExclude('.pathplanner/**')
	}
}

// Prevent root deploy to avoid dangerous parallel deployments
task deploy {
	doLast {
		throw new GradleException("""
❌ Running the deploy task without specifying a robot is disabled to prevent dangerous parallel deployments!

Instead, deploy to a specific robot:
./gradlew comp-bot:deploy        - Deploy to competition robot
./gradlew new-member-bot:deploy  - Deploy to new member robot
./gradlew offseason-bot:deploy   - Deploy to offseason robot

This prevents race conditions where each robot tries to deploy at the same time, causing the wrong code to be deployed.""".trim())
	}
}

// Compile only when inputs change; no dev server or Node process during simulation.
tasks.register('prepareSimApp', Exec) {
	group = 'simulation'
	description = 'Build the native Simulation Studio app (requires Node and Rust).'
	workingDir rootProject.file('sim-app')
	inputs.files(fileTree('sim-app/scripts'), fileTree('sim-app/src'), fileTree('sim-app/src-tauri/src'),
			fileTree('sim-app/src-tauri/capabilities'), fileTree('sim-app/src-tauri/icons'),
			'sim-app/package.json', 'sim-app/package-lock.json', 'sim-app/tsconfig.json',
			'sim-app/vite.config.ts', 'sim-app/index.html', 'sim-app/src-tauri/Cargo.toml',
			'sim-app/src-tauri/Cargo.lock', 'sim-app/src-tauri/build.rs', 'sim-app/src-tauri/tauri.conf.json')
	def windows = org.gradle.internal.os.OperatingSystem.current().isWindows()
	outputs.file('sim-app/src-tauri/target/release/simulation-studio' + (windows ? '.exe' : ''))
	if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
		outputs.dir('sim-app/src-tauri/target/release/bundle/macos/Simulation Studio.app')
	}
	dependsOn 'installSimAppDependencies'
	commandLine windows ? [
		'cmd',
		'/c',
		'npm',
		'run',
		'package'
	] : ['npm', 'run', 'package']
}

tasks.register('installSimAppDependencies', Exec) {
	group = 'simulation'
	workingDir rootProject.file('sim-app')
	inputs.files('sim-app/package.json', 'sim-app/package-lock.json')
	outputs.file('sim-app/node_modules/.package-lock.json')
	def windows = org.gradle.internal.os.OperatingSystem.current().isWindows()
	commandLine windows ? ['cmd', '/c', 'npm', 'ci'] : ['npm', 'ci']
}
