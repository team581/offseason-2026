plugins {
	id "edu.wpi.first.GradleRIO"
	id "com.peterabeles.gversion" version "1.11.0"
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

deploy {
	targets {
		roborio(getTargetTypeClass('RoboRIO')) {
			team = project.frc.getTeamOrDefault(9991)
			debug = project.frc.getDebugOrDefault(false)

			artifacts {
				frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
				}

				frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
					files = project.fileTree('src/main/deploy')
					directory = '/home/lvuser/deploy'
					deleteOldFiles = false
				}
			}
		}
	}
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

wpi.java.debugJni = false

def includeDesktopSupport = false

dependencies {
	implementation project(':shared')

	annotationProcessor wpi.java.deps.wpilibAnnotations()
	implementation wpi.java.deps.wpilib()
	implementation wpi.java.vendor.java()

	roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
	roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

	roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
	roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

	nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
	nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
	simulationDebug wpi.sim.enableDebug()

	nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
	nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
	simulationRelease wpi.sim.enableRelease()

	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


	// https://central.sonatype.com/artifact/com.google.guava/guava
	implementation 'com.google.guava:guava:33.6.0-jre'

	// https://central.sonatype.com/artifact/org.apache.commons/commons-geometry-euclidean
	implementation 'org.apache.commons:commons-geometry-euclidean:1.0'
}

test {
	useJUnitPlatform { excludeTags 'headless', 'spot-transport' }
	systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

jar {
	from {
		configurations.runtimeClasspath.collect {
			it.isDirectory() ? it : zipTree(it)
		}
	}
	from sourceSets.main.allSource
	manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Cross-language smoke test against a sibling Spot checkout; no cameras or GUI.
def spotTransportTest = tasks.register('spotTransportTest', Test) {
	group = 'verification'
	description = 'Checks real Spot Python estimates reach the offseason Java reader over local NT4'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'spot-transport' }
	def spotRepo = rootProject.file(providers.gradleProperty('spot.repo').getOrElse('../spot-2026')).absoluteFile
	systemProperty 'spot.repo', spotRepo.path
	def pythonPath = System.getProperty('os.name').toLowerCase().contains('windows') ? '.venv/Scripts/python.exe' : '.venv/bin/python'
	systemProperty 'spot.python', providers.gradleProperty('spot.python').getOrElse(new File(spotRepo, pythonPath).path)
	maxParallelForks = 1
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	testLogging { events 'passed', 'failed'; showStandardStreams = true }
}
wpi.java.configureTestTasks(spotTransportTest.get())

tasks.withType(JavaCompile) {
	options.compilerArgs.add '-XDstringConcat=inline'
}

project.compileJava.dependsOn(createVersionFile)
gversion {
	srcDir = "src/main/java"
	classPackage = "frc.robot.generated"
	className = "BuildConstants"
	dateFormat = "yyyy-MM-dd HH:mm:ss z"
	timeZone = "America/Los_Angeles"
	indent = "  "
}

// Run the registered robot tests through the same TestManager without a simulator window.
[
	headlessTest: 'Runs every registered robot test in headless simulation',
	straightLineTest: 'Runs the registered straight-line test in headless simulation'
].each { taskName, taskDescription ->
	def headlessTask = tasks.register(taskName, Test) {
		group = 'verification'
		description = taskDescription
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		useJUnitPlatform { includeTags 'headless' }
		if (taskName == 'straightLineTest') {
			systemProperty 'sim.test', 'STRAIGHT_LINE'
		}
		maxParallelForks = 1
		// Each robot fixture owns process-global HAL, Phoenix, and logging resources.
		forkEvery = 1
		systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
		systemProperty 'sim.logDir', layout.buildDirectory.dir("reports/${taskName}/logs").get().asFile.absolutePath
		project.properties.findAll { key, value ->
			key.startsWith('sim.')
		}.each { key, value ->
			systemProperty key, value.toString()
		}
		outputs.upToDateWhen { false }
		outputs.cacheIf { false }
		testLogging { events 'passed', 'failed', 'skipped' }
	}
	wpi.java.configureTestTasks(headlessTask.get())
}

// Export compiled camera geometry for the VS Code preview.
dependencies { implementation 'com.google.code.gson:gson:2.15.0' }
tasks.register('exportSpotCameraPreview', JavaExec) {
	dependsOn tasks.named('classes')
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'frc.robot.vision.SpotCameraPreviewExport'
	args layout.buildDirectory.file('spot-camera-preview/profile.json').get().asFile.absolutePath
}
