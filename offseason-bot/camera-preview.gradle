// Shared installer implementation; keep both robot project copies identical.
import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.nio.channels.FileChannel
import java.nio.file.StandardOpenOption

def installPreview = { boolean strict ->
	if (System.getenv('CI') || System.getenv('SSH_CONNECTION') || System.getenv('SSH_TTY') ||
			project.hasProperty('skipSpotCameraPreviewInstall')) return
		try {
			def manifest = new JsonSlurper().parse(file('camera-preview-release.json'))
			if (!manifest.sha256 || manifest.sha256.size() != 64) {
				throw new GradleException('Private preview release has not been published/pinned yet')
			}
			def windows = System.getProperty('os.name').toLowerCase().contains('windows')
			def candidates = []
			def override = project.findProperty('spotCameraPreviewCode') ?: System.getenv('SPOT_CAMERA_PREVIEW_CODE')
			if (override) candidates.add(override.toString())
			def cli = windows ? 'code.cmd' : 'code'
			(System.getenv('PATH') ?: '').split(File.pathSeparator).each {
				candidates.add(new File(it, cli).path)
			}
			def home = System.getProperty('user.home')
			if (windows) {
				candidates.add("${System.getenv('LOCALAPPDATA')}/Programs/Microsoft VS Code/bin/code.cmd")
				candidates.add("${System.getenv('ProgramFiles')}/Microsoft VS Code/bin/code.cmd")
				candidates.add("${System.getenv('PUBLIC')}/wpilib/2026/vscode/bin/code.cmd")
			} else {
				candidates.add('/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code')
				candidates.add("${home}/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code")
				candidates.add("${home}/wpilib/2026/vscode/Visual Studio Code.app/Contents/Resources/app/bin/code")
				candidates.add("${home}/wpilib/2026/vscode/bin/code")
				candidates.add('/usr/share/code/bin/code')
			}
			def code = candidates.find { new File(it).isFile() }
			if (!code) throw new GradleException('VS Code CLI not found; set -PspotCameraPreviewCode=/path/to/code')
			def run = { List<String> command ->
				def full = windows && command[0].endsWith('.cmd') ? ['cmd.exe', '/c'] + command : command
				def process = new ProcessBuilder(full.collect {
					it.toString()
				}).redirectErrorStream(true).start()
				def text = new StringBuffer()
				def reader = process.consumeProcessOutputStream(text)
				if (!process.waitFor(90, java.util.concurrent.TimeUnit.SECONDS)) {
					process.destroyForcibly(); throw new GradleException('Preview setup command timed out')
				}
				reader.join()
				if (process.exitValue() != 0) throw new GradleException(text.toString())
				text.toString()
			}
			def cache = new File(gradle.gradleUserHomeDir, 'spot-camera-preview')
			cache.mkdirs()
			FileChannel.open(new File(cache, 'install.lock').toPath(), StandardOpenOption.CREATE, StandardOpenOption.WRITE).withCloseable { channel ->
				def lock = channel.tryLock()
				if (!lock) {
					if (strict) throw new GradleException('Another preview installation is running'); return
				}
				try {
					def installed = run([
						code,
						'--list-extensions',
						'--show-versions'
					]).readLines().find {
						it.toLowerCase().startsWith(manifest.extensionId.toLowerCase() + '@')
					}?.split('@')?.last()
					def compare = { String a, String b ->
						def left = a.tokenize('.').collect { it.toInteger() }
						def right = b.tokenize('.').collect { it.toInteger() }
						for (int i = 0;i<3;i++) {
							int c = left[i]<=>right[i]; if(c) return c
						}
						return 0
					}
					if (installed && compare(installed, manifest.version) >= 0) return
						def asset = new File(cache, manifest.sha256 + '.vsix')
					def checksum = { File f ->
						MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
					}
					if (!asset.exists() || checksum(asset) != manifest.sha256) {
						def staging = new File(cache, 'download-' + UUID.randomUUID()); staging.mkdirs()
						try {
							run([
								'gh',
								'release',
								'download',
								manifest.tag,
								'--repo',
								manifest.repository,
								'--pattern',
								manifest.asset,
								'--dir',
								staging.path
							])
							def download = new File(staging, manifest.asset)
							if (checksum(download) != manifest.sha256) throw new GradleException('VSIX checksum mismatch')
							java.nio.file.Files.move(download.toPath(), asset.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
						} finally {
							staging.deleteDir()
						}
					}
					run([
						code,
						'--install-extension',
						asset.path,
						'--force'
					])
					logger.lifecycle('Spot Camera Preview installed. Reload VS Code if requested.')
				} finally {
					lock.release()
				}
			}
		} catch (Exception e) {
			def message = "Spot Camera Preview setup: ${e.message}. See Spot docs: VS Code camera preview. Retry installSpotCameraPreview; authenticate with gh auth login if needed."
			if (strict) throw new GradleException(message, e)
			logger.warn(message)
		}
}
tasks.register('installSpotCameraPreview') { doLast { installPreview(true) } }
tasks.register('ensureSpotCameraPreview') { doLast { installPreview(false) } }
tasks.named('build') { dependsOn tasks.named('ensureSpotCameraPreview') }
