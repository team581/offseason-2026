[project]
name = "cad"
version = "0.0.0"
description = "Tools for converting CAD exports to AdvantageScope assets"
requires-python = ">=3.14"
dependencies = ["cadquery-ocp==8.0.1.1.0", "numpy==2.5.4", "scipy==1.18.1", "trimesh==5.2.0"]

[dependency-groups]
dev = ["ty"]

[tool.ty.src]
include = ["**/*.py"]
